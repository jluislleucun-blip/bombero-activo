name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: 20

      - name: Install dependencies
        run: |
          cd "bombero activo"
          npm install

      - name: Build Project
        run: |
          cd "bombero activo"
          echo "Compilando IPA..."
